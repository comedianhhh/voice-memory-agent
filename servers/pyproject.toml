[project]
name = "local-speech-servers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "faster-whisper>=1.1",
  "kokoro>=0.9",
  "soundfile",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "numpy",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
